<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0a0e">
  <script>
    // Aplicar el modo día antes de pintar, para que no parpadee.
    try {
      if (localStorage.getItem('tema') === 'claro') {
        document.documentElement.dataset.tema = 'claro';
        document.querySelector('meta[name=theme-color]').content = '#fff6fb';
      }
    } catch (e) { /* sin almacenamiento */ }
  </script>
  <title>Mi Tiendita</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- La letra se carga sin bloquear: sin internet la app abre igual con la letra del sistema. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="barra-sup">
    <span class="marca">Mi Tiendita</span>
    <h1 id="titulo">Vender</h1>
  </header>
  <div id="aviso"></div>
  <main id="contenido"></main>
  <nav class="pestanas">
    <button data-tab="vender" class="activa"><span>🛒</span>Vender</button>
    <button data-tab="pedidos"><span>🍽️</span>Entregar<b class="badge" hidden></b></button>
    <button data-tab="inventario"><span>📦</span>Productos</button>
    <button data-tab="clientes"><span>📒</span>Cuentas</button>
    <button data-tab="reportes"><span>📊</span>Ganancias</button>
    <button data-tab="respaldo"><span>⚙️</span>Más</button>
  </nav>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
